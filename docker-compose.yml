services:
  postgres:
    image: postgres:16-alpine
    container_name: tezukitchen-postgres
    environment:
      POSTGRES_DB: tezukitchen
      POSTGRES_USER: ${DATABASE_USERNAME:-tezukitchen}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-tezukitchen}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: tezukitchen-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tezukitchen
      DATABASE_USERNAME: ${DATABASE_USERNAME:-tezukitchen}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlbWVjaGFuZ2VtZWNoYW5nZW1lY2hhbmdlbWVjaGFuZ2VtZWNoYW5nZW1lY2hhbmdlbWVjaGFuZ2VtZQ==}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_Tai04XqY8wEdl3}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-2kNIUiONJbjDn7PGstqjEYyN}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: tezukitchen-postgres-data
