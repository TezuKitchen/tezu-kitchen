server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tezukitchen-api

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tezukitchen}
    username: ${DATABASE_USERNAME:tezukitchen}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_Tai04XqY8wEdl3}
    key-secret: ${RAZORPAY_KEY_SECRET:2kNIUiONJbjDn7PGstqjEYyN}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

# API Documentation
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  file:
    name: logs/tezukitchen-api.log
  level:
    root: INFO
    com.tezukitchen.api: INFO
